# One-off workflow. Creates renv.lock for the example and commits it.
name: Create renv lockfile

on:
  push:
    paths:
      - ".github/workflows/create-renv-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::renv
            any::gosset
            any::PlackettLuce
            any::ggplot2
            any::sessioninfo
            any::testthat
            any::jsonlite
            any::readxl
            any::rmarkdown
            any::rticles

      - name: Create the lockfile
        run: |
          options(renv.consent = TRUE)
          renv::init(restart = FALSE)
          renv::status()
        shell: Rscript {0}

      - name: Commit renv files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add renv.lock .Rprofile renv/activate.R renv/settings.json renv/.gitignore
          git commit -m "Pin package versions of the example with renv"
          git push
