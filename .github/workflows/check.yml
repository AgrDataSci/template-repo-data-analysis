# Runs every analysis script and its tests on each push and pull request,
# so the repository always shows whether the computation still reproduces.
# Tests run with the package versions pinned in renv.lock.
name: Check analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # installs the system libraries the R packages need (e.g. GLPK for
      # igraph, which PlackettLuce depends on); renv is switched off here
      - name: Install system libraries
        uses: r-lib/actions/setup-r-dependencies@v2
        env:
          RENV_CONFIG_AUTOLOADER_ENABLED: false
        with:
          packages: |
            any::gosset
            any::PlackettLuce
            any::ggplot2
            any::sessioninfo
            any::testthat
            any::jsonlite
            any::readxl

      # installs the exact package versions listed in renv.lock
      - name: Restore pinned packages
        if: hashFiles('renv.lock') != ''
        uses: r-lib/actions/setup-renv@v2

      - name: Run tests
        run: |
          for f in tests/test-*.R; do
            echo "Running $f"
            Rscript "$f"
          done
