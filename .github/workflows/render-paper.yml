# Renders docs/paper.Rmd to docs/paper.pdf whenever the paper or its
# bibliography changes, and commits the PDF back to the same branch.
name: Render paper

on:
  push:
    paths:
      - "docs/paper.Rmd"
      - "docs/paper.bib"
      - ".github/workflows/render-paper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::rticles

      - name: Render the paper
        run: rmarkdown::render("docs/paper.Rmd")
        shell: Rscript {0}

      - name: Commit the PDF if it changed
        run: |
          if git diff --quiet -- docs/paper.pdf; then
            echo "PDF already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add docs/paper.pdf
            git commit -m "Render paper"
            git push
          fi
